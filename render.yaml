services:
  - type: web
    name: blogksolve-backend
    env: node
    region: singapore
    rootDir: Backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false        # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false        # Set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false        # Set to your Vercel URL e.g. https://blogksolve.vercel.app
      - key: PORT
        value: 5000
